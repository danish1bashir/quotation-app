<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body onload="fun()">


	    <div id="wrapper">
	       	<h1>Quote of the day</h1>
	       	<p id="qwrapper"></p>
	       	<p id="author"></p>

	       	<button onclick="fun()" id="nq">Next Quote</button>

	    </div>
	   <div class="footer">&copy;Danish Bashir</div>

</body>
</html>

<script>
	async function fun(){

		id=Math.random();
		id=id*1454
		//alert(id);
		id=Math.floor(id);
		//alert(id);

		data=await fetch('https://dummyjson.com/quotes/' + id);
		data=await data.json();
		console.log(data)
		document.getElementById("qwrapper").innerText=data.quote;
		document.getElementById("author").innerText=data.author;


	}
	

</script>
